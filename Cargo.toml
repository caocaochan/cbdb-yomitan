[package]
name = "cbdb-yomitan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
opencc-fmmseg = "0.13.1"
oxrdf = "0.3.3"
oxttl = "0.2.5"
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "with_tone", "heteronym"] }
regex = "1.13.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
unicode-script = "0.5.9"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
